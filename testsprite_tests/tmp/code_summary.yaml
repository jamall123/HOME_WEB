version: "2"
type: frontend
tech_stack:
  - HTML5
  - Vanilla JavaScript (ES Modules)
  - Vite (build tool)
  - Firebase (Auth, Firestore, Storage, Hosting)
  - Agora RTC (live video streaming)
  - CSS3 (custom design system)
routes:
  - path: /
    file: index.html
    auth_required: false
    description: Landing page for Jhome company with hero, features, and CTA sections
  - path: /courses.html
    file: courses.html
    auth_required: false
    description: Course catalog listing available academy courses with enrollment CTA
  - path: /course-room.html
    file: course-room.html
    auth_required: true
    description: Live course room with video, curriculum, chat, and instructor dashboard
features:
  - name: Homepage
    description: Company landing page showcasing Jhome tech products and services
    files:
      - index.html
      - css/style.css
      - js/features/global/GlobalController.js
    entry_route: /
    user_interactions:
      - View hero section with company branding
      - Scroll through features and story sections
      - Click enrollment CTA button
    api_calls: []
    auth_required: false
  - name: Course Catalog
    description: Browse available courses and request enrollment
    files:
      - courses.html
      - js/repositories/CourseRepository.js
      - js/features/enrollment/EnrollmentController.js
    entry_route: /courses.html
    user_interactions:
      - View list of available courses
      - Click to enroll in a course
      - Submit enrollment request form
    api_calls:
      - method: GET
        endpoint: Firestore /courses collection
      - method: POST
        endpoint: Firestore /enrollmentRequests collection
    auth_required: false
  - name: Live Course Room
    description: Interactive learning room with live video, curriculum, chat and presence
    files:
      - course-room.html
      - js/features/room/RoomController.js
      - js/features/curriculum/CurriculumController.js
      - js/features/media/MediaEngine.js
      - js/features/chat/ChatController.js
      - js/features/presence/PresenceController.js
    entry_route: /course-room.html
    user_interactions:
      - Join the course room
      - Watch live or recorded video
      - Navigate between curriculum lessons
      - Send chat messages
      - View attendees list
      - Instructor starts/stops live broadcast
    api_calls:
      - method: GET
        endpoint: Firestore /curriculum, /curriculumLessons
      - method: POST
        endpoint: Firestore /course_chats
      - method: POST
        endpoint: Firestore /activeSessions (presence heartbeat)
    auth_required: true
  - name: Admin Dashboard
    description: Admin panel for managing users, courses, and enrollment requests
    files:
      - js/features/admin/AdminController.js
      - js/repositories/AdminRepository.js
      - js/repositories/UserRepository.js
    entry_route: /course-room.html
    user_interactions:
      - View pending enrollment requests
      - Approve or reject enrollment requests
      - Create and manage users
      - View analytics
    api_calls:
      - method: GET
        endpoint: Firestore /enrollmentRequests
      - method: POST
        endpoint: Firestore /enrollments
    auth_required: true
known_limitations:
  - issue: courseRoom chunk is ~285kB uncompressed (67kB gzipped) - acceptable for complex SPA
    location: dist/assets/courseRoom-*.js
    impact: Slightly longer initial load for course room page
