<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Jhome Admin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>J</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: var(--bg-dark); }
        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar { width: 250px; background: rgba(255,255,255,0.05); padding: 2rem 1rem; border-left: 1px solid rgba(255,255,255,0.1); }
        .admin-sidebar h2 { margin-bottom: 2rem; color: var(--primary-color); text-align: center; }
        .admin-nav { display: flex; flex-direction: column; gap: 0.5rem; }
        .admin-nav a { padding: 1rem; color: var(--text-light); text-decoration: none; border-radius: 8px; transition: 0.3s; }
        .admin-nav a:hover, .admin-nav a.active { background: rgba(0,255,204,0.1); color: var(--primary-color); }
        
        .admin-main { flex: 1; padding: 2rem; overflow-y: auto; }
        .admin-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 2rem; margin-bottom: 2rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: var(--primary-color); }
        .action-btn { background: none; border: none; color: #ff4757; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        .action-btn:hover { color: #ff6b81; }
    </style>
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>Jhome Admin</h2>
            <nav class="admin-nav">
                <a href="#" class="active"><i class="fas fa-university"></i> حسابات الدفع</a>
                <a href="#" onclick="alert('قريباً')"><i class="fas fa-users"></i> طلبات الاشتراك</a>
                <a href="#" onclick="alert('قريباً')"><i class="fas fa-book"></i> إدارة الدورات</a>
                <a href="index.html"><i class="fas fa-home"></i> العودة للموقع</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 class="display-3" style="font-size: 2rem;">إدارة حسابات الدفع</h1>
                <p class="text-muted">تحكم في الحسابات البنكية التي تظهر للطلاب في شاشة الدفع</p>
            </header>

            <!-- Add New Account Form -->
            <div class="admin-card">
                <h3>إضافة حساب بنكي جديد</h3>
                <form id="add-bank-form" style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 1rem; align-items: end; margin-top: 1.5rem;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>اسم البنك</label>
                        <input type="text" id="new-bank-name" class="form-input" required placeholder="مثال: بنكك">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>اسم صاحب الحساب</label>
                        <input type="text" id="new-account-name" class="form-input" required placeholder="الاسم الرباعي">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>رقم الحساب</label>
                        <input type="text" id="new-account-number" class="form-input" required placeholder="رقم الحساب">
                    </div>
                    <button type="submit" class="btn btn-primary" style="height: 48px;"><i class="fas fa-plus"></i> إضافة</button>
                </form>
            </div>

            <!-- List of Accounts -->
            <div class="admin-card">
                <h3>الحسابات الحالية</h3>
                <table>
                    <thead>
                        <tr>
                            <th>البنك</th>
                            <th>الاسم</th>
                            <th>رقم الحساب</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="bank-accounts-list">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
